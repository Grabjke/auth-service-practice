server {
    listen 80;

    # Статика собранного React-приложения
    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }

    # /api/* проксируем в контейнер бэка (имя сервиса из compose.yaml)
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
    }
}
